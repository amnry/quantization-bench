# Real pod (H100 80GB) — full study on Qwen2.5-7B-Instruct, no shortcuts.
name: full
eval:
  backend: vllm
  limit: null                  # no limit — full eval sets
  tasks: ["gsm8k", "mmlu", "ruler"]
  num_fewshot: 5
  ruler_lengths: [4096, 16384]
bench:
  enabled: true
  num_prompts: 200
  workloads:
    decode:    {input_len: 128,  output_len: 512, concurrency: [1, 4, 16, 64]}
    prefill:   {input_len: 4096, output_len: 16,  concurrency: [1, 4, 16, 64]}
    longctx:   {input_len: 8192, output_len: 256, concurrency: [16, 64, 128, 256]}
server:
  max_model_len: 16384
  gpu_memory_utilization: 0.90
  max_num_seqs: 256
