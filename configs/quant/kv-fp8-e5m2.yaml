# KV cache, Tier 2 — BF16 weights/activations, FP8 e5m2 KV cache.
# tier_axis=format: both KV tiers are 8-bit; e5m2 (2 mantissa bits) is the harder/lossier format.
# CHECK AT SMOKE: confirm installed vLLM still exposes "fp8_e5m2" as a --kv-cache-dtype value
# (some versions only ship fp8 == e4m3 as calibrated; e5m2 support has moved around).
id: kv-fp8-e5m2
target: kv
tier: 2
tier_axis: format
weights: null
activations: null
kv_cache:
  enabled: true
  num_bits: 8
  type: float
  format: e5m2
  strategy: tensor
  dynamic: false
vllm_extra_args: ["--kv-cache-dtype", "fp8_e5m2"]
